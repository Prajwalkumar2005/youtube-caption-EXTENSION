name: CI Test & Build Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-and-test:
    name: Test & Validate Suite
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r overlay_app/requirements.txt

      - name: Run System Diagnostics
        run: python overlay_app/diagnostics.py

      - name: Execute Standard Unit Tests
        run: python overlay_app/run_all_tests.py

      - name: Execute WebSocket Bridge Security Tests
        run: python overlay_app/test_bridge.py

  package-extension:
    name: Package Chrome Extension Artifact
    needs: validate-and-test
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Package Extension Archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path extension/* -DestinationPath dist/yt-lyrics-overlay-extension.zip -Force

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yt-lyrics-overlay-extension
          path: dist/yt-lyrics-overlay-extension.zip
          retention-days: 30
