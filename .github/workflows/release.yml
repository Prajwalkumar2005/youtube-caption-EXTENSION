name: Release Pipeline

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    name: Build & Publish Release Assets
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r overlay_app/requirements.txt
          pip install pyinstaller

      - name: Run Test Verification
        run: python overlay_app/run_all_tests.py

      - name: Package Extension ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path extension/* -DestinationPath dist/yt-lyrics-overlay-extension.zip -Force

      - name: Compile Standalone Executable
        run: |
          cd overlay_app
          pyinstaller --noconsole --onefile --name "YT_Lyrics_Overlay" --clean main_overlay.py
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/yt-lyrics-overlay-extension.zip
            overlay_app/dist/YT_Lyrics_Overlay.exe
          generate_release_notes: true
